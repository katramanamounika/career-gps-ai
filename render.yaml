services:
  - type: web
    name: career-gps-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
